services:
  bot:
    image: bot
    build:
      context: .
      dockerfile: src/Services/Bot/Afonya.Bot.WebWorker/Dockerfile
      args:
        - configuration=Debug
    ports:
      - 5000:5000
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ~/.vsdbg:/remote_debugger:rw
